<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawPal - Checkout</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <!-- Website header with the PawPal image -->
    <header>
        <img src="images/pawpal-header.jpg" alt="PawPal pets">
    </header>

    <!-- Navigation menu -->
    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </nav>

    <section>

        <!-- Checkout section (class "intro" is used in the CSS) -->
        <article class="intro">
            <h2>Checkout</h2>
            <p>Please check your order before you confirm.</p>

            <!-- script.js shows the products from the basket here -->
            <div id="checkoutItems"></div>

            <p id="checkoutTotal" class="checkout-total">Total: €0.00</p>

            <button id="placeOrderButton">Place Order</button>

            <!-- script.js shows the confirmation message here -->
            <p id="orderMessage" class="order-message"></p>

            <p>
                <a href="services.html">Back to Products</a>
            </p>
        </article>

    </section>

    <!-- Website footer -->
    <footer>
        <p>&copy; 2026 PawPal</p>
    </footer>

    <!-- JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
