<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawPal - Contact Us</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

    <!-- Website header with the PawPal image -->
    <header>
        <img src="images/pawpal-header.jpg" alt="PawPal pets">
    </header>

    <!-- Navigation menu with links to the 4 pages -->
    <nav>
     <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="about.html">About Us</a>
    <a href="contact.html">Contact Us</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
    </nav>

    <section>

        <!-- Contact section (class "intro" is used in the CSS) -->
        <article class="intro">
            <h2>Contact Us</h2>
            <p>
                Do you have a question? Send us a message.
            </p>

            <!-- Contact form: onsubmit runs validateForm() from script.js -->
            <!-- If the function returns false, the form is not sent -->
            <form id="contactForm" onsubmit="return validateForm()">

                <div>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name">
                </div>
                <br>

                <div>
                    <label for="phone">Phone:</label>
                    <input type="text" id="phone" name="phone">
                </div>
                <br>

                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                </div>
                <br>

                <!-- Drop-down list to choose the type of query -->
                <div>
                    <label for="query">Nature of Query:</label>
                    <select id="query" name="query">
                        <option value="dog-walking">Dog Walking</option>
                        <option value="pet-sitting">Pet Sitting</option>
                        <option value="home-visits">Home Visits</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <br>

                <div>
                    <label for="message">Message:</label>
                    <br>
                    <textarea id="message" name="message" cols="40" rows="5"></textarea>
                </div>
                <br>

                <!-- Submit sends the form, Reset clears all fields -->
                <div>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </div>

            </form>
        </article>

    </section>

    <!-- Website footer -->
    <footer>
        <p>&copy; 2026 PawPal</p>
    </footer>

    <!-- JavaScript file (form validation on this page) -->
    <script src="script.js"></script>

</body>
</html>
